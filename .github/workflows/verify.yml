name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: imagecraft-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Environment
        run: |
          set -eu
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version
          scripts/select-xcode.sh
          python3 scripts/check-swift-toolchain.py
      - name: Core verification
        run: scripts/verify.sh
      - name: Public API and consumer
        run: |
          scripts/verify-public-api.sh
          scripts/verify-consumer-package.sh
      - name: Current integration contract
        run: scripts/verify-integration-contract.sh
