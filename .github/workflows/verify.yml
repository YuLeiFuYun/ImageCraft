name: ImageCraft Exact Candidate Verification

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: exact-imagecraft-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout exact verified candidate commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 060390c3564dcde7f389766e914cfb86dd39f37d
          fetch-depth: 0
          persist-credentials: false
      - name: Restore exact candidate modes and prove workflow authority
        env:
          EXPECTED_WORKING_TREE_DIGEST: "7eef71bd05ed9bb62e958b2a259d795787aaf00aa7e0f14dfe5efef6b275bfe1"
          EXPECTED_FILE_COUNT: "610"
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import subprocess
          from pathlib import Path

          modes = {"ConformanceKits/ImageCodec/v1/Examples/ImageIOFactory.swift":384,"ConformanceKits/ImageCodec/v1/Fixtures/manifest.json":384,"ConformanceKits/ImageCodec/v1/observation-schema.json":384,"ConformanceKits/ImagePackedRGBA8/v1/Fixtures/manifest.json":384,"ConformanceKits/ImagePackedRGBA8/v1/Harness/ImagePackedRGBA8ConformanceTests.swift":384,"ConformanceKits/ImagePackedRGBA8/v1/README.md":384,"ConformanceKits/ImagePackedRGBA8/v1/manifest.json":384,"ConformanceKits/ImagePackedRGBA8/v1/observation-schema.json":384,"ConformanceKits/ImagePackedRGBA8/v1/run.py":457,"Fixtures/CodecConformance/ConformanceFactory.swift":384,"Fixtures/CodecConformance/Package.swift":384,"Fixtures/CodecConformance/Sources/ImageCraftCodecConformanceFixture/ImageCraftCodecConformanceFixture.swift":384,"Fixtures/ConsumerSmoke/Tests/ImageCraftConsumerSmokeTests/HDRFailClosedPublicTests.swift":384,"Fixtures/ConsumerSmoke/Tests/ImageCraftConsumerSmokeTests/PDFPublicSurfaceTests.swift":384,"Fixtures/ConsumerSmoke/Tests/ImageCraftConsumerSmokeTests/SVGPublicSurfaceTests.swift":384,"Fixtures/LimitedCodecConformance/ConformanceFactory.swift":384,"Fixtures/LimitedCodecConformance/Package.swift":384,"Fixtures/LimitedCodecConformance/README.md":384,"Fixtures/LimitedCodecConformance/Sources/LimitedCodecConformanceFixture/LimitedPNGImageCodec.swift":384,"Fixtures/PackedRGBA8Conformance/ConformanceFactory.swift":384,"Fixtures/PackedRGBA8Conformance/Package.swift":384,"Fixtures/PackedRGBA8Conformance/Sources/ImageCraftPackedRGBA8ConformanceFixture/ImageCraftPackedRGBA8ConformanceFixture.swift":384,"Sources/ImageCraftCore/PDFRasterization.swift":384,"Sources/ImageCraftCore/SVGRasterization.swift":384,"Sources/ImageCraftImageIO/WebPAnimationInspector.swift":384,"Sources/ImageCraftPDF/CoreGraphicsPDFRasterizer.swift":384,"Sources/ImageCraftSVG/CoreGraphicsSVGRasterizer.swift":384,"Tests/ImageCraftImageIOTests/Resources/Corpus/FormatBreadthV1/avif-m4-fixtures.json":384,"Tests/ImageCraftImageIOTests/Resources/Corpus/FormatBreadthV1/gainmap-m6-fixtures.json":384,"Tests/ImageCraftPDFTests/PDFRasterizerTests.swift":384,"Tests/ImageCraftSVGTests/SVGRasterizerTests.swift":384,"Tools/Corpus/verify_avif_m4_fixtures.py":384,"Tools/Corpus/verify_gainmap_m6_fixture.py":384,"scripts/verify-avif-ios-runtime.sh":457,"scripts/verify-hdr-ios-runtime.sh":457,"scripts/verify-image-codec-conformance-kit.sh":457,"scripts/verify-image-packed-rgba8-conformance-kit.sh":457}
          for raw, mode in modes.items():
              path = Path(raw)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"mode restoration target is not a regular file: {raw}")
              os.chmod(path, mode)

          def stable(value):
              payload = json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
              return hashlib.sha256(payload.encode("utf-8")).hexdigest()

          tracked_raw = subprocess.check_output(["git", "ls-files", "-z"])
          tracked = [Path(item.decode("utf-8")) for item in tracked_raw.split(b"\0") if item]
          untracked_raw = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "-z"])
          untracked = [item.decode("utf-8") for item in untracked_raw.split(b"\0") if item]
          if untracked:
              raise SystemExit(f"unexpected untracked files before authority check: {untracked[:8]}")

          manifest = {}
          for path in sorted(set(tracked), key=lambda p: p.as_posix()):
              key = path.as_posix()
              if path.is_symlink():
                  manifest[key] = stable({
                      "kind": "symlink",
                      "target": str(path.readlink()),
                      "mode": stat.S_IMODE(path.lstat().st_mode),
                  })
              elif path.is_file():
                  content = hashlib.sha256(path.read_bytes()).hexdigest()
                  manifest[key] = stable({
                      "kind": "file",
                      "content_sha256": content,
                      "mode": stat.S_IMODE(path.stat().st_mode),
                  })
              else:
                  raise SystemExit(f"tracked path is neither file nor symlink: {key}")

          digest = stable(manifest)
          expected_digest = os.environ["EXPECTED_WORKING_TREE_DIGEST"]
          expected_count = int(os.environ["EXPECTED_FILE_COUNT"] )
          print(f"exact authority: files={len(manifest)} digest={digest} restored_modes={len(modes)}")
          if len(manifest) != expected_count or digest != expected_digest:
              raise SystemExit(f"candidate authority mismatch: files={len(manifest)} digest={digest}")
          PY
      - name: Verify exact candidate commit binding
        run: |
          test "$(git rev-parse HEAD)" = "060390c3564dcde7f389766e914cfb86dd39f37d"
          printf 'candidate_snapshot=e892b30ca8c2b98ae9a40c3077d496e92ce4d8d28101e2c254a3f121bdc1d215\n'
      - name: Environment
        run: |
          set -eu
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          swift --version
          scripts/select-xcode.sh
          python3 scripts/check-swift-toolchain.py
      - name: Core verification
        run: scripts/verify.sh
      - name: Public API and consumer
        run: |
          scripts/verify-public-api.sh
          scripts/verify-consumer-package.sh
      - name: Current integration contract
        run: scripts/verify-integration-contract.sh
